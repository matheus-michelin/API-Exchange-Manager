<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Exchange Manager: per-user balance and statement" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="320" rx="14" fill="#0E1A24"/>

  <text x="64" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#DCE6E1">Exchange</text>
  <text x="64" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#DCE6E1">Manager</text>
  <text x="66" y="262" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#7E97A4">Per-user balance and statement, accurate to the cent.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <line x1="640" y1="64" x2="640" y2="256" stroke="#1F3341" stroke-width="2"/>

    <text x="690" y="104" fill="#7E97A4" font-size="16">in</text>
    <text x="900" y="104" fill="#5BD6A0" text-anchor="end">+ 1,500.00</text>
    <text x="1136" y="104" fill="#DCE6E1" text-anchor="end">1,500.00</text>

    <text x="690" y="164" fill="#7E97A4" font-size="16">out</text>
    <text x="900" y="164" fill="#F2766B" text-anchor="end">− 320.50</text>
    <text x="1136" y="164" fill="#DCE6E1" text-anchor="end">1,179.50</text>

    <text x="690" y="224" fill="#7E97A4" font-size="16">in</text>
    <text x="900" y="224" fill="#5BD6A0" text-anchor="end">+ 80.00</text>
    <text x="1136" y="224" fill="#DCE6E1" text-anchor="end">1,259.50</text>

    <g stroke="#1F3341" stroke-width="2" stroke-dasharray="4 6">
      <line x1="690" y1="126" x2="1136" y2="126"/>
      <line x1="690" y1="186" x2="1136" y2="186"/>
    </g>
  </g>
</svg>
